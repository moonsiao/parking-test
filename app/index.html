<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking &amp; Key Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f5f7;color:#222;font-size:16px}
header{background:#1d2b53;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header span{font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
.muted{color:#777;font-size:13px}.ok{color:#0a7d32}.warn{color:#b26a00}.bad{color:#c62828}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:#1d2b53;color:#fff;font-size:17px;font-weight:600;margin-top:10px;cursor:pointer}
.btn.sec{background:#fff;color:#1d2b53;border:2px solid #1d2b53}.btn.green{background:#0a7d32}.btn.red{background:#c62828}
.btn:disabled{opacity:.5}
.sm{padding:7px 12px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:14px;cursor:pointer}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-top:6px}
label{display:block;margin-top:10px;font-size:14px;color:#555}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:10px 14px;border:2px solid #ccc;border-radius:8px;background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{border-color:#1d2b53;background:#1d2b53;color:#fff}
.badge{display:inline-block;white-space:nowrap;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
.b-in{background:#e3f4e8;color:#0a7d32}.b-out{background:#fff3cd;color:#8a5a00}.b-long{background:#e6ecff;color:#1d2b53}
.big{font-size:30px;font-weight:700;margin:4px 0}
.cols{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:6px;align-items:center}.col .h{font-size:12px;color:#777}
.spot{width:64px;min-height:46px;padding:4px 0;border:2px solid #1d2b53;border-radius:6px;background:#fff;font-weight:700;font-size:15px;cursor:pointer;line-height:1.1}
.spot small{display:block;font-size:10px;font-weight:400;color:#777}
.spot.taken{border-color:#bbb;background:#eee;color:#999}.spot.near{background:#fff3cd}.spot.mine{background:#0a7d32;color:#fff;border-color:#0a7d32}
.err{background:#fdecea;color:#c62828;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover{background:#f7f8fa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:#777}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal>div{background:#fff;width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.qrgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qr{border:1px dashed #999;padding:8px;text-align:center;font-weight:700;break-inside:avoid}
.qr div{display:flex;justify-content:center;margin-bottom:4px}
.lang{margin-left:8px;padding:4px 10px;border:1px solid rgba(255,255,255,.6);border-radius:6px;background:transparent;color:#fff;font-size:13px;cursor:pointer}
@media print{header,.noprint{display:none!important}main{max-width:none;padding:0}.card{box-shadow:none}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let LANG=store.get("lang")==="zh"?"zh":"en";
function L(){return I18N[LANG]}
function t(k,...a){let s=k.split(".").reduce((o,p)=>o&&o[p],L());if(s==null)s=k;return String(s).replace(/\{(\d)\}/g,(_,i)=>a[i]??"")}
function errText(code){const[c,p]=String(code).split("|");return L().err[c]?t("err."+c,p):code}
function stText(s){return s==="In"?t("statusIn"):s==="Out"?t("statusOut"):s==="Loaned"?t("statusLoaned"):s}
function rsText(r){return L().reasons[r]||r}
let ME=null;

async function api(action,data={}){
  const body=JSON.stringify(Object.assign({action,token:store.get("token")},data));
  let r;
  try{r=await fetch(CONFIG.API_URL,{method:"POST",body}).then(x=>x.json())}
  catch(e){throw new Error(t("err.E_NET"))}
  if(!r.ok){if(/^E_(LOGIN|DISABLED)/.test(r.error)){store.set("token",null);ME=null}throw new Error(errText(r.error))}
  return r;
}
function params(){return new URLSearchParams(location.search)}
function carUrl(id){return location.origin+location.pathname+"?car="+encodeURIComponent(id)}
function badge(s){return `<span class="badge ${s==="In"?"b-in":s==="Loaned"?"b-long":"b-out"}">${esc(stText(s))}</span>`}
function fmtTime(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleString(LANG==="zh"?"zh-MY":"en-MY",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function since(iso){if(!iso)return"";const m=Math.round((Date.now()-new Date(iso))/60000);return m<60?t("minutes",m):t("hoursMin",Math.floor(m/60),m%60)}
function showErr(el,e){el.innerHTML=`<div class="err">${esc(e.message||e)}</div>`}
function busy(btn,on,txt){if(!btn)return;btn.disabled=on;if(txt)btn.textContent=txt}
function setChrome(){document.documentElement.lang=LANG==="zh"?"zh":"en";document.title=t("title");$("#title").textContent=t("title");$("#lang").textContent=LANG==="zh"?"EN":"中文"}
$("#lang").onclick=()=>{LANG=LANG==="zh"?"en":"zh";store.set("lang",LANG);setChrome();
  if(CURRENT_REDRAW)CURRENT_REDRAW();else route()};
let CURRENT_REDRAW=null;

/* ---------- Routing ---------- */
async function route(){
  CURRENT_REDRAW=null;setChrome();
  $("#modal").innerHTML="";
  if(!store.get("token"))return viewLogin();
  if(!ME){try{const r=await api("me");ME=r}catch(e){return viewLogin(e)}}
  $("#who").textContent=ME.name+(ME.role==="admin"?" · admin":"");

function pickZone(c,occ,method,why){

function spotGrid(zone,cell){
  return '<div class="cols">'+CONFIG.SPOTS[zone].map(r=>`<div class="col"><div class="h">${esc(L().rows[r.label]||r.label)}</div>`+Object.keys(r.spots).reverse().map(cell).join("")+"</div>").join("")+"</div>";
}
function pickSpot(c,occ,zone,method,pt,why){
  const near=pt?nearestSpot(pt,zone):null;
  const grid=spotGrid(zone,id=>{const tk=occ[id]&&occ[id]!==c.id;
    return `<button class="spot ${tk?"taken":""} ${id===near?"near":""}" data-s="${id}">${id}${tk?`<small>${esc(occ[id])}</small>`:""}</button>`});
  $("#act").innerHTML=`<div class="card"><h3>${esc(t("spotTitle",zone))}</h3>
    <p class="muted" style="margin-top:0">${method==="gps"?esc(t("gpsSays",zone)):esc(why?t("pickZoneWhy",why):t("manualPick"))}${near?t("nearHint"):""}${t("lookGround")}</p>
    ${grid}<div id="msg"></div></div>`;
  $("#act").querySelectorAll(".spot").forEach(b=>b.onclick=()=>confirmSpot(c,zone,b.dataset.s,method,occ[b.dataset.s]&&occ[b.dataset.s]!==c.id?occ[b.dataset.s]:null));
}

    catch(e){showErr($("#m2"),e);busy($("#yes"),false,t("confirm"))}};

/* ---------- GPS ---------- */
function toXY(p,o){const R=6371000,k=Math.PI/180;return[(p[1]-o[1])*k*R*Math.cos(o[0]*k),(p[0]-o[0])*k*R]}
function inPoly(pt,poly){const P=toXY([pt.lat,pt.lng],poly[0]),V=poly.map(v=>toXY(v,poly[0]));let c=false;
  for(let i=0,j=V.length-1;i<V.length;j=i++){const[xi,yi]=V[i],[xj,yj]=V[j];if((yi>P[1])!==(yj>P[1])&&P[0]<(xj-xi)*(P[1]-yi)/(yj-yi)+xi)c=!c}return c}
function detectZone(pt){return Object.keys(CONFIG.ZONES).find(z=>inPoly(pt,CONFIG.ZONES[z]))||null}
function nearestSpot(pt,zone){let best=null,bd=1e9;(CONFIG.SPOTS[zone]||[]).forEach(r=>Object.entries(r.spots).forEach(([id,p])=>{const[x,y]=toXY(p,[pt.lat,pt.lng]);const d=Math.hypot(x,y);if(d<bd){bd=d;best=id}}));return best}

/* ---------- Map (drawn from real coordinates) ---------- */
function zoneMap(zone,opt={}){
  const poly=CONFIG.ZONES[zone],o=poly[0],k=Math.PI/180,R=6371000;
  const xy=p=>[(p[1]-o[1])*k*R*Math.cos(o[0]*k),-(p[0]-o[0])*k*R]; // x east, y down(south)
  const P=poly.map(xy);
  const rows=(CONFIG.SPOTS[zone]||[]).map(r=>({label:r.label,spots:Object.entries(r.spots).map(([id,p])=>({id,xy:xy(p)}))}));
  const spotsXY=[].concat(...rows.map(r=>r.spots.map(s=>s.xy)));const all=spotsXY.length?spotsXY:P;
  const pad=4.5,minX=Math.min(...all.map(p=>p[0]))-pad,maxX=Math.max(...all.map(p=>p[0]))+pad,minY=Math.min(...all.map(p=>p[1]))-pad,maxY=Math.max(...all.map(p=>p[1]))+pad;
  const W=maxX-minX,H=maxY-minY,f=n=>n.toFixed(2);
  let g=`<polygon points="${P.map(p=>f(p[0])+","+f(p[1])).join(" ")}" fill="#4a4f57" stroke="#e8c547" stroke-width="0.4" stroke-dasharray="1.5 1"/>`;
  rows.forEach(r=>{
    const a=r.spots[0].xy,b=r.spots[r.spots.length-1].xy;let dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    const nx=-dy,ny=dx,ang=Math.atan2(dy,dx)*180/Math.PI;
    r.spots.forEach(s=>{
      const [cx,cy]=s.xy,car=(opt.occupied||{})[s.id],hl=opt.highlight===s.id;
      const click=opt.clickable?` data-spot="${s.id}" ${car?`data-c="${esc(car)}"`:""} style="cursor:pointer"`:"";
      g+=`<g transform="translate(${f(cx)},${f(cy)}) rotate(${f(ang)})"${click}>
        <rect x="-1.2" y="-2.2" width="2.4" height="4.4" fill="${hl?"#2e7d32":"#4a4f57"}" stroke="#fff" stroke-width="0.15"/>
        ${car?`<rect x="-0.9" y="-1.9" width="1.8" height="3.8" rx="0.55" fill="${hl?"#c8e6c9":"#1d6fd1"}" stroke="#0d3b75" stroke-width="0.1"/>
          <rect x="-0.7" y="-1.15" width="1.4" height="0.7" rx="0.2" fill="#9cc7f5" opacity=".9"/><rect x="-0.7" y="0.7" width="1.4" height="0.5" rx="0.2" fill="#9cc7f5" opacity=".9"/>`:""}
      </g>`;
      if(hl)g+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="3.2" fill="none" stroke="#ff5252" stroke-width="0.35"><animate attributeName="r" values="2.6;3.6;2.6" dur="1.6s" repeatCount="indefinite"/></circle>`;
      if(car)g+=`<text x="${f(cx)}" y="${f(cy-0.35)}" font-size="0.6" font-weight="700" fill="${hl?"#1b5e20":"#fff"}" text-anchor="middle" dominant-baseline="middle" pointer-events="none">${esc(car)}</text>
        <text x="${f(cx)}" y="${f(cy+0.45)}" font-size="0.5" fill="${hl?"#1b5e20":"#dbe9ff"}" text-anchor="middle" dominant-baseline="middle" pointer-events="none">${s.id}</text>`;
      else g+=`<text x="${f(cx)}" y="${f(cy)}" font-size="0.9" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle" pointer-events="none">${s.id}</text>`;
    });
  });
  // north arrow
  g+=`<g transform="translate(${f(minX+2)},${f(minY+2.8)})"><polygon points="0,-2 0.9,1 0,0.4 -0.9,1" fill="#fff"/><text y="2.4" font-size="1.1" fill="#fff" text-anchor="middle">N</text></g>`;
  return `<svg viewBox="${f(minX)} ${f(minY)} ${f(W)} ${f(H)}" style="width:100%;max-width:${opt.max||520}px;display:block;margin:0 auto;background:#7d9a5b;border-radius:10px">${g}</svg>`;
}

        <td>${c.status==="In"?(c.spot?esc(c.spot)+(c.method==="manual"?` <span class="muted">${t("manual")}</span>`:c.method==="gps_outside"?` <span class="bad">${t("gpsOutside")}</span>`:""):`<span class="warn">${t("noSpot")}</span>`):"🔑 "+esc(c.holder)+'<div class="muted">'+esc(rsText(c.reason))+(c.note?" · "+esc(c.note):"")+"</div>"}</td>
        <td class="muted">${c.status==="In"?esc(c.updated):since(c.outTime)+(c.expected?"<br>"+esc(t("expShort",c.expected)):"")}</td></tr>`).join("")||`<tr><td class="muted">${t("none")}</td></tr>`}
      </table></div>
      <div class="card"><h3>${t("addCar")}</h3><div class="row"><input id="nid" placeholder="${t("carIdFull")}" style="flex:2"><input id="nmodel" placeholder="${t("model")}" style="flex:1"><input id="ncolor" placeholder="${t("colour")}" style="flex:1"></div>
      <button class="btn sec" id="addcar">${t("save")}</button><div id="cmsg"></div></div>`;
  }else if(ADM.tab==="map"){
    body=Object.keys(CONFIG.SPOTS).map(z=>{
      const grid=zoneMap(z,{occupied:d.occupied,clickable:true,max:640});
      const total=CONFIG.SPOTS[z].reduce((a,r)=>a+Object.keys(r.spots).length,0),used=CONFIG.SPOTS[z].reduce((a,r)=>a+Object.keys(r.spots).filter(id=>d.occupied[id]).length,0);
      return`<div class="card"><h3>${esc(t("zoneUsed",z,used,total))}</h3>${grid}</div>`}).join("");
  }else if(ADM.tab==="staff"){
    body=`<div class="card"><table><tr><th>${t("colName")}</th><th>${t("colEmail")}</th><th>${t("colRole")}</th><th></th></tr>
      ${d.staff.map(s=>`<tr><td><b>${esc(s.name)}</b>${s.active?"":` <span class="bad">${t("disabled")}</span>`}${s.defaultPin?`<div class="muted">${t("defaultPin")}</div>`:""}</td><td class="muted">${esc(s.email)}</td><td>${s.role==="admin"?t("roleAdmin"):t("roleStaff")}</td>
        <td><div class="row"><button class="sm" data-edit="${esc(s.name)}">${t("edit")}</button><button class="sm" data-reset="${esc(s.name)}">${t("resetPin")}</button><button class="sm" data-tog="${esc(s.name)}">${s.active?t("disable"):t("enable")}</button></div></td></tr>`).join("")}</table></div>
      <div class="card"><h3>${t("addStaff")}</h3><input id="sname" placeholder="${t("colName")}"><input id="semail" placeholder="${t("emailPh")}">
      <select id="srole"><option value="staff">${t("roleStaff")}</option><option value="admin">${t("roleAdmin")}</option></select>
      <button class="btn sec" id="addstaff">${t("save")}</button><div id="smsg"></div><p class="muted">${t("newStaffPin")}</p></div>`;
  }else{
    body=`<div class="card noprint"><p class="muted" style="margin-top:0">${t("deskQrHint")}</p><button class="btn" onclick="window.print()">${t("print")}</button></div>
      <div class="card" style="text-align:center;break-after:page"><h2 style="font-size:28px">${t("deskQrTitle")}</h2><div id="qr-desk" style="display:flex;justify-content:center;margin:12px 0"></div>
        <div style="font-size:18px;font-weight:700">Scan before taking a key · 拿钥匙前先扫</div></div>
      <h3 class="noprint">${t("carQrs")}</h3><p class="muted noprint">${t("qrHint")}</p>
      <div class="qrgrid">${cars.map(c=>`<div class="qr"><div id="qr-${esc(c.id)}"></div>${esc(c.id)}<div class="muted" style="font-weight:400">${esc(c.model)}</div></div>`).join("")}</div>`;
  }
  $("#app").innerHTML=`<div class="noprint"><div class="stats"><div class="stat"><b>${n("In")}</b><span>${t("statusIn")}</span></div><div class="stat"><b>${n("Out")}</b><span>${t("statusOut")}</span></div>
    <div class="stat"><b>${n("Loaned")}</b><span>${t("statusLoaned")}</span></div><div class="stat"><b class="${d.alerts.length?"bad":"ok"}">${d.alerts.length}</b><span>${t("alertsN")}</span></div></div>
    ${d.alerts.length?`<div class="card" style="margin-top:12px"><h3 class="bad">${t("alertsTitle")}</h3><table>${d.alerts.map(a=>`<tr ${a.car?`class="click" data-c="${esc(a.car)}"`:""}><td><b>${esc(a.car||"—")}</b></td><td>${esc(alertText(a))}</td><td>${esc(a.who)}</td></tr>`).join("")}</table></div>`:`<div class="card ok" style="margin-top:12px">${t("noAlerts")}</div>`}
    <div class="tabs">${tabs.map(([k,lbl])=>`<button class="chip ${ADM.tab===k?"on":""}" data-tab="${k}">${lbl}</button>`).join("")}<button class="chip" id="refresh">${t("refresh")}</button><button class="chip" onclick="location.hash=''">${t("home")}</button></div></div>${body}`;
  const A=$("#app");
  A.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ADM.tab=b.dataset.tab;renderAdmin()});
  $("#refresh").onclick=viewAdmin;
  A.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ADM.filter=b.dataset.f;renderAdmin()});
  A.querySelectorAll("[data-c]").forEach(r=>r.onclick=()=>showHistory(r.dataset.c));
  if($("#q"))$("#q").oninput=e=>{ADM.q=e.target.value;const p=e.target.selectionStart;renderAdmin();$("#q").focus();$("#q").setSelectionRange(p,p)};
  if($("#addcar"))$("#addcar").onclick=async()=>{try{await api("saveCar",{id:$("#nid").value,model:$("#nmodel").value,color:$("#ncolor").value});viewAdmin()}catch(e){showErr($("#cmsg"),e)}};
  if($("#addstaff"))$("#addstaff").onclick=async()=>{try{await api("saveStaff",{name:$("#sname").value,email:$("#semail").value,role:$("#srole").value});ADM.tab="staff";viewAdmin()}catch(e){showErr($("#smsg"),e)}};
  A.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const s=d.staff.find(x=>x.name===b.dataset.edit);$("#sname").value=s.name;$("#semail").value=s.email;$("#srole").value=s.role;$("#sname").scrollIntoView()});
  A.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{try{await api("adminResetPin",{name:b.dataset.reset});viewAdmin()}catch(e){alertBox(e.message)}});
  A.querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{const s=d.staff.find(x=>x.name===b.dataset.tog);
    try{await api("saveStaff",{name:s.name,email:s.email,role:s.role,active:!s.active});viewAdmin()}catch(e){alertBox(e.message)}});
  if(ADM.tab==="qr"&&window.QRCode)new QRCode(document.getElementById("qr-desk"),{text:location.origin+location.pathname,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
  if(ADM.tab==="qr"&&window.QRCode)cars.forEach(c=>new QRCode(document.getElementById("qr-"+c.id),{text:carUrl(c.id),width:120,height:120,correctLevel:QRCode.CorrectLevel.M}));
}
function alertBox(msg){$("#modal").innerHTML=`<div class="modal"><div><div class="err">${esc(msg)}</div><button class="btn sec" onclick="$('#modal').innerHTML=''">${t("close")}</button></div></div>`}
function methodText(m){return m==="manual"?t("manual"):m==="gps_outside"?t("gpsOutside"):""}
async function showHistory(id){
  const c=ADM.data.cars.find(x=>x.id===id);
  $("#modal").innerHTML=`<div class="modal"><div><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(id)}</h2><button class="sm" id="x">${t("close")}</button></div><div id="h" class="muted">${t("loading")}</div></div></div>`;
  $("#x").onclick=()=>$("#modal").innerHTML="";
  try{const r=await api("history",{carId:id});
    $("#h").innerHTML=`<table><tr><th>${t("colWhen")}</th><th>${t("colAction")}</th><th>${t("colWho")}</th><th>${t("colDetail")}</th></tr>${r.logs.map(l=>`<tr><td class="muted">${esc(l.time)}</td><td>${esc(L().actions[l.action]||l.action)}</td><td>${esc(l.who)}</td><td>${esc([rsText(l.reason),l.note,l.spot,methodText(l.method)].filter(Boolean).join(" · "))}</td></tr>`).join("")||`<tr><td>${t("noHistory")}</td></tr>`}</table>
    ${c?`<div class="row" style="margin-top:12px"><button class="sm" id="off">${t("deactivate")}</button></div>`:""}`;
    if($("#off"))$("#off").onclick=async()=>{try{await api("saveCar",{id:c.id,model:c.model,color:c.color,active:false});viewAdmin()}catch(e){showErr($("#h"),e)}};
  }catch(e){showErr($("#h"),e)}
}

route();
</script>
</body>
</html>
